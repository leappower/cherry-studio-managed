# fork-win-build.yml
#
# CherryStudio 企业受管版（cherry-managed）· Fork Windows 补丁包构建 workflow
#
# 目标（V-M0-2，方案-企业受管版-v4.0 §13.1）：
#   GitHub Actions windows-latest runner 上运行 electron-builder，产出 NSIS 安装包
#   ${productName}-${version}-${arch}-setup.exe，供测试机（192.168.3.188/69）安装验证。
#
# 参考：官方 .github/workflows/nightly-build.yml / ci.yml（本 workflow 不改动官方文件）。
#
# 签名处理（审计修正，M0-2）：
#   electron-builder.yml:98-99 配置了 signtoolOptions.sign = scripts/win-sign.js。
#   但 scripts/win-sign.js:60 仅在设置了环境变量 WIN_SIGN 时才执行签名，
#   未设置时是 no-op（不会阻塞构建）——与官方 nightly-build.yml 的 Windows job 一致
#   （官方 Windows job 不传 CSC_LINK / CSC_KEY_PASSWORD / WIN_SIGN，Windows 包不签名）。
#   因此本 workflow **明确不设置 WIN_SIGN，不配置 CSC_* secrets**，即临时禁用签名，
#   保证 CI 出包不被签名阻塞。
#   兜底：显式设 CSC_IDENTITY_AUTO_DISCOVERY=false，防止 electron-builder 自动发现
#   本机证书而尝试签名。
#   注：未签名包在 Windows SmartScreen 会提示"未知发布者"，仅用于 M0 求证阶段内网验证，
#       正式发布签名属后续 F-11/E-2 范围，届时再引入受管签名（WIN_SIGN + 证书 secrets）。

# Sidecar 注入（E-1，批次 F）：
#   本 workflow 负责把 cherry-managed 仓库构建出的 sidecar.exe 注入到 NSIS 安装包。
#   - 在 pnpm build:win:x64 之前，Checkout cherry-managed 仓库（leappower/cherry-managed, 默认分支 master）
#     到 ./sidecar-src 临时目录，用 PyInstaller 构建 sidecar.exe（命令与 cherry-managed/.github/workflows/build_windows.yml 同款）。
#   - 设置 env SIDECAR_EXE_PATH 指向该 sidecar.exe 的绝对路径，electron-builder 的
#     electron-builder.yml extraResources 读 ${env.SIDECAR_EXE_PATH} 把它打进 resources/sidecar/。
#   - 若 sidecar 构建失败（关键步骤 set -e 且 test -f 校验产物），workflow 明确失败，
#     不静默产出无 Sidecar 的安装包。
#   - 签名策略保持不变：不设 WIN_SIGN / CSC_*，仅 CSC_IDENTITY_AUTO_DISCOVERY=false 兜底。
#   - ⛔ 本 workflow 只改 fork-win-build.yml；不改动官方 nightly-build.yml / ci.yml，
#     不改动 cherry-managed/.github/workflows/build_windows.yml（sidecar 独立构建流水线）。

name: Fork Windows Build

on:
  workflow_dispatch:      # 手动触发（M0 求证阶段主用）
  push:
    branches:
      - managed/**        # Fork 改动分支，自动触发

permissions:
  contents: write       # 允许上传 GitHub Release 资产（安装包走 codeload CDN, 下载快）
  actions: write          # 允许清理/管理 artifacts

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'   # 24.11.1

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        # 不传 version：pnpm/action-setup 自动读 package.json 的 packageManager 字段（pnpm@11.8.0+sha512...）
        # 避免与显式 version 冲突报 "Multiple versions of pnpm specified"（对齐官方 ci.yml/nightly-build.yml）

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      # --------------------------------------------------------------------
      # E-1（批次 F）：Sidecar 构建与注入
      # --------------------------------------------------------------------
      - name: Check out cherry-managed repo (sidecar source)
        uses: actions/checkout@v4
        with:
          repository: leappower/cherry-managed
          ref: master                    # sidecar 默认分支（build_windows.yml 在此分支）
          path: './sidecar-src'           # 临时目录，避免与主仓库工作区冲突
          # cherry-managed 是私有仓库，actions/checkout 默认用 GITHUB_TOKEN（仅对
          # 当前 workflow 所在仓库有权限）无法跨仓读私有仓库 → 注入专用 PAT secret。
          # 该 PAT 由 leappower 账号签发，存于仓库 Actions secret，不回显、不泄露。
          token: ${{ secrets.CHERRY_MANAGED_PAT }}

      - name: Set up Python (PyInstaller)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'          # 与 cherry-managed build_windows.yml 的 setup-python 版本一致

      - name: Install sidecar build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller websocket-client

      - name: Build sidecar.exe (PyInstaller)
        id: sidecar-build
        shell: bash
        run: |
          set -euxo pipefail
          cd ./sidecar-src/sidecar
          # 直接传 scripts/build.spec 打包（spec 内已用 EXE() 指定 one-file，产物名为 sidecar.exe）。
          # 注意：build_windows.yml 里的命令带了 --onefile / --specpath，这两个是 makespec-only 选项，
          # 当直接传入 .spec 文件时 PyInstaller 会报 "makespec options not valid when a .spec file is given"。
          # 此处采用正确写法（仅 --distpath / --workpath），等价产出，避免 workflow 每次必失败。
          pyinstaller --clean --noconfirm \
            --distpath ../dist --workpath ../build \
            scripts/build.spec
          # 明确校验产物存在；缺失即 fail，防止静默产出无 sidecar 的安装包
          test -f ../dist/sidecar.exe
          ls -la ../dist/sidecar.exe
          # 输出绝对路径给后续 build:win:x64 步骤（GITHUB_ENV 供同 job 后续步骤读取）
          echo "SIDECAR_EXE_PATH=$(pwd)/../dist/sidecar.exe" >> "$GITHUB_ENV"

      - name: Build Windows x64
        shell: bash
        run: pnpm build:win:x64
        env:
          # 签名处理（见文件头说明）：不设 WIN_SIGN / CSC_* → 临时禁用签名，出包不阻塞。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 兜底：禁止自动发现本机证书
          # E-1：注入 sidecar.exe 绝对路径，electron-builder 读 ${env.SIDECAR_EXE_PATH}
          # 经 electron-builder.yml extraResources → resources/sidecar（未注入时该资源跳过）。
          SIDECAR_EXE_PATH: ${{ env.SIDECAR_EXE_PATH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192

      - name: List build artifacts
        shell: bash
        run: |
          echo "构建产物:"
          find dist -maxdepth 1 -type f \( -name "*-setup.exe" -o -name "*-portable.exe" -o -name "latest*.yml" \) | sort

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          # NSIS 包：${productName}-${version}-${arch}-setup.exe（electron-builder.yml artifactName）
          name: fork-win-build-setup
          path: |
            dist/*-setup.exe
          retention-days: 14
          compression-level: 8
          if-no-files-found: error

      # --------------------------------------------------------------------
      # E-1（批次 F）：上传安装包到 GitHub Release（走 codeload CDN, 下载快）
      # 背景：GitHub Actions artifact 存储(Azure Blob) 对部分网络 IP 限速严重,
      #       本地直下 artifact 极慢; Release 资产走 GitHub codeload CDN 可高速下载。
      # 用 gh CLI(预装) 上传, 自动创建/复用 Release, tag 用短 SHA 区分每次构建。
      # --------------------------------------------------------------------
      - name: Upload installer to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER=$(find dist -maxdepth 1 -name "*-setup.exe" | head -1)
          echo "上传安装包: $INSTALLER ($(du -h "$INSTALLER" | cut -f1))"
          TAG="e1-build-${GITHUB_SHA::8}"
          # 创建(或复用) Release 并上传资产
          gh release create "$TAG" "$INSTALLER" \
            --repo "${{ github.repository }}" \
            --title "E1 Windows 安装包 (${GITHUB_SHA::8})" \
            --notes "E-1 批次F: 含 sidecar.exe 的 CherryStudio 受管版 NSIS 安装包" \
            --target "${{ github.sha }}" \
            --clobber \
          || gh release upload "$TAG" "$INSTALLER" --repo "${{ github.repository }}" --clobber
          echo "Release 标签: $TAG"